name: Android release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, unit test, lint, and package Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - name: Build, lint, test, and assemble the Capacitor APK
        run: npm run test:android:full
